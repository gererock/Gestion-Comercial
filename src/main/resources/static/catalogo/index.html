<!doctype html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <meta
            name="description"
            content="Catálogo de productos de Todo Descartables"
    >

    <title>Catálogo | Todo Descartables</title>

    <link
            rel="stylesheet"
            href="/css/home.css"
    >

</head>

<body class="catalog-page">

<main class="catalog-placeholder">

    <div class="container catalog-placeholder__content">

        <a
                class="catalog-placeholder__brand"
                href="/"
        >
            <span class="brand__mark">
                <span class="brand__fallback">
                    TD
                </span>
            </span>

            <span>
                Todo Descartables
            </span>
        </a>


        <span class="section-label">
            Próximamente
        </span>


        <h1>
            Nuestro catálogo
        </h1>


        <p>
            Estamos preparando el catálogo de productos.
            Desde acá vas a poder consultar productos,
            precios y realizar tus pedidos.
        </p>


        <div class="catalog-placeholder__actions">

            <a
                    class="button button--primary"
                    href="/"
            >
                ← Volver al inicio
            </a>

            <a
                    class="button button--secondary"
                    href="/login/index.html"
            >
                Iniciar sesión
            </a>

        </div>

    </div>

</main>

</body>

</html>
