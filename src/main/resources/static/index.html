<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <meta
            name="description"
            content="Sitio web del comercio"
    >

    <title>Inicio | Gestión Comercial</title>

    <link
            rel="stylesheet"
            href="/css/home.css"
    >
</head>

<body>

<header class="site-header">

    <div class="container site-header__content">

        <a
                class="brand"
                href="/"
                aria-label="Ir al inicio"
        >

            <span class="brand__mark">
                GC
            </span>

            <span
                    class="brand__name"
                    id="nombre-comercio-header"
            >
                Comercio
            </span>

        </a>

        <!--
            La navbar completa se implementará
            en la Etapa 2.
        -->

    </div>

</header>


<main>

    <!--
        BASE DE LA PÁGINA INSTITUCIONAL

        Etapa 2:
        - Navbar
        - Hero
        - Shop

        Etapa 3:
        - Sobre nosotros
        - Historia

        Etapa 4:
        - Equipo
        - Contacto
        - Ubicación
    -->

    <section class="home-base">

        <div class="container">

            <span class="section-label">
                Sitio institucional
            </span>

            <h1
                    class="home-base__title"
                    id="nombre-comercio"
            >
                Comercio
            </h1>

            <p
                    class="home-base__description"
                    id="descripcion-comercio"
            >
                Cargando información...
            </p>

            <div class="home-base__actions">

                <a
                        class="button button--primary"
                        href="#"
                        aria-disabled="true"
                >
                    Ver catálogo
                </a>

                <a
                        class="button button--secondary"
                        href="#nosotros"
                >
                    Conocenos
                </a>

            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container site-footer__content">

        <p>
            ©
            <span id="anio-actual"></span>
            <span id="nombre-comercio-footer">
                Comercio
            </span>
        </p>

    </div>

</footer>


<script
        src="/js/home.js"
        defer
></script>

</body>

</html>
