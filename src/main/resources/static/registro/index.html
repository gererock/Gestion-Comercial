<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <title>Crear cuenta | Gestión Comercial</title>

    <link
            rel="stylesheet"
            href="/login/css/style.css"
    >
</head>

<body>

<main class="cl-login02-demo">

    <section
            class="cl-login02"
            aria-labelledby="registro-title"
    >

        <div class="cl-login02__card">

            <span
                    class="cl-login02__mark"
                    aria-hidden="true"
            >
                <svg
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                >
                    <path
                            d="M12 3c5 0 9 3.6 9 8.5S17 20 12 20c-4.6 0-9-2.8-9-7.5S7 3 12 3Z"
                            fill="#fff"
                    />

                    <circle
                            cx="15"
                            cy="10"
                            r="2"
                            fill="currentColor"
                    />
                </svg>
            </span>


            <h1
                    class="cl-login02__title"
                    id="registro-title"
            >
                Crear una cuenta
            </h1>


            <p class="cl-login02__sub">
                Registrate para realizar pedidos y consultar tus compras.
            </p>


            <form
                    class="cl-login02__form"
                    id="registro-form"
                    novalidate
            >

                <!-- NOMBRE -->
                <div
                        class="cl-login02__field"
                        data-field
                >

                    <label
                            class="cl-login02__label"
                            for="nombre"
                    >
                        Nombre
                    </label>

                    <input
                            class="cl-login02__input"
                            id="nombre"
                            name="nombre"
                            type="text"
                            autocomplete="given-name"
                            maxlength="100"
                            required
                            aria-describedby="nombre-error"
                    >

                    <p
                            class="cl-login02__error"
                            id="nombre-error"
                            data-error
                    ></p>

                </div>


                <!-- APELLIDO -->
                <div
                        class="cl-login02__field"
                        data-field
                >

                    <label
                            class="cl-login02__label"
                            for="apellido"
                    >
                        Apellido
                    </label>

                    <input
                            class="cl-login02__input"
                            id="apellido"
                            name="apellido"
                            type="text"
                            autocomplete="family-name"
                            maxlength="100"
                            required
                            aria-describedby="apellido-error"
                    >

                    <p
                            class="cl-login02__error"
                            id="apellido-error"
                            data-error
                    ></p>

                </div>


                <!-- EMAIL -->
                <div
                        class="cl-login02__field"
                        data-field
                >

                    <label
                            class="cl-login02__label"
                            for="email"
                    >
                        Correo electrónico
                    </label>

                    <input
                            class="cl-login02__input"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="usuario@correo.com"
                            maxlength="120"
                            required
                            aria-describedby="email-error"
                    >

                    <p
                            class="cl-login02__error"
                            id="email-error"
                            data-error
                    ></p>

                </div>


                <!-- CONTRASEÑA -->
                <div
                        class="cl-login02__field"
                        data-field
                >

                    <label
                            class="cl-login02__label"
                            for="password"
                    >
                        Contraseña
                    </label>

                    <div class="cl-login02__pw">

                        <input
                                class="cl-login02__input"
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                                aria-describedby="password-error"
                        >

                        <button
                                class="cl-login02__eye"
                                type="button"
                                id="toggle-password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false"
                                aria-controls="password"
                        >

                            <!-- OJO ABIERTO -->
                            <svg
                                    class="cl-login02__eye-on"
                                    viewBox="0 0 24 24"
                                    width="18"
                                    height="18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                            >
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <!-- OJO TACHADO -->
                            <svg
                                    class="cl-login02__eye-off"
                                    viewBox="0 0 24 24"
                                    width="18"
                                    height="18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                            >
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/>
                                <path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                            </svg>

                        </button>

                    </div>

                    <p
                            class="cl-login02__error"
                            id="password-error"
                            data-error
                    ></p>

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->
                <div
                        class="cl-login02__field"
                        data-field
                >

                    <label
                            class="cl-login02__label"
                            for="confirmacionPassword"
                    >
                        Confirmar contraseña
                    </label>

                    <div class="cl-login02__pw">

                        <input
                                class="cl-login02__input"
                                id="confirmacionPassword"
                                name="confirmacionPassword"
                                type="password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                                aria-describedby="confirmacion-password-error"
                        >

                        <button
                                class="cl-login02__eye"
                                type="button"
                                id="toggle-confirmacion-password"
                                aria-label="Mostrar contraseña"
                                aria-pressed="false"
                                aria-controls="confirmacionPassword"
                        >

                            <!-- OJO ABIERTO -->
                            <svg
                                    class="cl-login02__eye-on"
                                    viewBox="0 0 24 24"
                                    width="18"
                                    height="18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                            >
                                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                            <!-- OJO TACHADO -->
                            <svg
                                    class="cl-login02__eye-off"
                                    viewBox="0 0 24 24"
                                    width="18"
                                    height="18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    aria-hidden="true"
                            >
                                <path d="M3 3l18 18"/>
                                <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1"/>
                                <path d="M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/>
                                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
                            </svg>

                        </button>

                    </div>

                    <p
                            class="cl-login02__error"
                            id="confirmacion-password-error"
                            data-error
                    ></p>

                </div>


                <!-- MENSAJE GENERAL -->
                <div
                        class="cl-login02__message"
                        id="registro-message"
                        role="alert"
                        hidden
                ></div>


                <button
                        class="cl-login02__submit"
                        type="submit"
                >
                    Registrarse
                </button>

            </form>

        </div>


        <p class="cl-login02__foot">
            ¿Ya tenés una cuenta?

            <a
                    class="cl-login02__link"
                    href="/login/index.html"
            >
                Iniciar sesión
            </a>
        </p>

    </section>

</main>

<script src="/registro/js/registro.js"></script>

</body>

</html>
