<button id="logout">
    Cerrar sesión
</button>


<script src="../js/auth.js"></script>

<script>

    if (Auth.requerirRol(
            'VENDEDOR',
            'ADMINISTRADOR'
        )) {

        const usuario =
            Auth.obtenerUsuario();

        document.getElementById(
            'usuario'
        ).textContent =
            `Bienvenido, ${usuario.nombre}`;
    }

    document.getElementById(
        'logout'
    ).addEventListener(
        'click',
        Auth.cerrarSesion
    );

</script>

</body>

</html>
